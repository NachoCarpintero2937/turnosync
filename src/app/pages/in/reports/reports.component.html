<div class="container reports-dashboard">
  <div
    class="pd-5 d-flex mt-5 align-items-center justify-content-between header-section"
  >
    <div class="d-flex align-items-center">
      <div class="line">
        <hr />
      </div>
      <span class="title dybella-text">Reportes Mensuales e Históricos</span>
    </div>

    <div class="filter-section">
      <button
        class="btn btn-ai mr-3"
        (click)="analyzeWithAI()"
        [disabled]="analyzing || !historicalDataPayload"
      >
        <span *ngIf="!analyzing">✨ Analizar Tendencias</span>
        <span *ngIf="analyzing"
          ><i class="fas fa-spinner fa-spin"></i> Analizando...</span
        >
      </button>

      <span class="filter-label">Año:</span>
      <select
        class="custom-select year-selector"
        [(ngModel)]="selectedYear"
        (change)="onYearChange()"
      >
        <option *ngFor="let year of availableYears" [value]="year">
          {{ year }}
        </option>
      </select>
    </div>
  </div>

  <!-- AI Analysis Result Card -->
  <div class="ai-result-card mt-3 mb-4 p-4" *ngIf="aiAnalysisResponse">
    <div class="d-flex align-items-center mb-3">
      <div class="ai-icon">✨</div>
      <h3 class="m-0 ml-2 ai-title">Análisis de Tendencias (IA)</h3>
    </div>
    <div class="ai-content texto-bonito" [innerHTML]="aiAnalysisResponse"></div>
  </div>

  <!-- Loading State -->
  <div class="loading-overlay" *ngIf="loading">
    <div class="spinner"></div>
  </div>

  <div class="charts-grid" [class.is-loading]="loading">
    <!-- Ingresos Mensuales -->
    <div class="chart-card">
      <div class="card-header">
        <h3 class="card-title">Ingresos Mensuales AR$</h3>
        <span class="card-subtitle">Recaudación ({{ selectedYear }})</span>
      </div>
      <div class="card-body">
        <canvas #barChartPrices></canvas>
      </div>
    </div>

    <!-- Turnos Cancelados -->
    <div class="chart-card">
      <div class="card-header">
        <h3 class="card-title text-danger">Turnos Cancelados</h3>
        <span class="card-subtitle">Mensual ({{ selectedYear }})</span>
      </div>
      <div class="card-body">
        <canvas #barChartCancelled></canvas>
      </div>
    </div>

    <!-- Recaudación Histórica (Full Width) -->
    <div class="chart-card full-width">
      <div class="card-header">
        <h3 class="card-title text-purple">Recaudación Histórica</h3>
        <span class="card-subtitle">Evolución de ingresos totales por año</span>
      </div>
      <div class="card-body large-chart">
        <canvas #lineChartYear></canvas>
      </div>
    </div>
  </div>
</div>
